version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: factoryvision_db
    environment:
      POSTGRES_DB: factoryvision
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localpassword123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d factoryvision"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.dockerfile
    container_name: factoryvision_backend
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql+asyncpg://postgres:localpassword123@db:5432/factoryvision
      - JWT_SECRET_KEY=local_development_jwt_secret_key_987654321
      - SIMULATE_AI=True
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./ai:/app/ai
      - ./database:/app/database
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.dockerfile
    container_name: factoryvision_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
